name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run test-suite
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: acos_ci
          JWT_SECRET: ci-secret
          APP_ENV: test
          DEBUG_OTP: "true"
          VERCEL: "1"
        run: pytest -c backend/pytest.ini -q
      - name: Anomaly-detector evaluation report
        run: cd frontend/server && python -m ml.evaluate

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: CI=false yarn build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
